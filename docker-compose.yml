services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openledger
      POSTGRES_PASSWORD: openledger
      POSTGRES_DB: openledger
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openledger -d openledger']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: bitnami/pgbouncer:1.24.1
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: openledger
      POSTGRESQL_PASSWORD: openledger
      POSTGRESQL_DATABASE: openledger
      PGBOUNCER_DATABASE: openledger
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_PORT_NUMBER: 6432
    ports:
      - '6432:6432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U openledger -d openledger']
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      args:
        SERVICE: api
    working_dir: /app
    command: ['npm', 'run', 'migrate']
    environment:
      DATABASE_URL: postgres://openledger:openledger@postgres:5432/openledger
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://openledger:openledger@pgbouncer:6432/openledger
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://openledger:openledger@pgbouncer:6432/openledger
      WORKER_INTERVAL_MS: 30000
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy

  simulator:
    build:
      context: .
      args:
        SERVICE: simulator
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      SIMULATOR_PORT: 3001
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 5s
      timeout: 3s
      retries: 8

volumes:
  pgdata:
