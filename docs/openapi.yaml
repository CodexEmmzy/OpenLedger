openapi: 3.0.3
info:
  title: OpenLedger API
  version: 0.0.1
  description: |
    Contract-first ledger API. Phase 0 implements GET /health and request
    validation. Account and transfer handlers return 501 until a later phase.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and Postgres connectivity
      responses:
        '200':
          description: Process is up and can query Postgres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Process is up but Postgres is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accounts:
    post:
      operationId: createAccount
      summary: Create an account (Phase 0 stub)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Not implemented in this phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account (Phase 0 stub)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Not implemented in this phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      summary: Get account balance (Phase 0 stub)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Balance in integer minor units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Not implemented in this phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/transfers:
    post:
      operationId: createTransfer
      summary: Post a transfer (Phase 0 stub)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: Transfer posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Not implemented in this phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/transfers/{id}:
    get:
      operationId: getTransfer
      summary: Get a transfer (Phase 0 stub)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Not implemented in this phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    Currency:
      type: string
      enum: [NGN, USD]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, postgres]
      properties:
        status:
          type: string
          enum: [ok]
        postgres:
          type: string
          enum: [up]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        requestId:
          type: string
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    Account:
      type: object
      additionalProperties: false
      required: [id, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        currency:
          $ref: '#/components/schemas/Currency'
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    Balance:
      type: object
      additionalProperties: false
      required: [accountId, amountMinor, currency]
      properties:
        accountId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          description: Integer minor units (kobo/cents). Never a float.
        currency:
          $ref: '#/components/schemas/Currency'
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destinationAccountId, amountMinor, currency]
      properties:
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Integer minor units (kobo/cents). Never a float.
        currency:
          $ref: '#/components/schemas/Currency'
    Transfer:
      type: object
      additionalProperties: false
      required: [id, sourceAccountId, destinationAccountId, amountMinor, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        createdAt:
          type: string
          format: date-time
